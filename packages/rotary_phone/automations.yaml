automation:
  - id: rotary_phone_handle_dial
    alias: "Rotary Phone Handle Dial"
    mode: single
    trigger:
      - platform: mqtt
        topic: rotarydial/dial
    condition:
      - condition: template
        value_template: "{{ trigger.payload not in ['', 'unknown', 'unavailable', 'none'] }}"
    action:
      - service: script.rotary_phone_handler
        data:
          dialed: "{{ trigger.payload }}"